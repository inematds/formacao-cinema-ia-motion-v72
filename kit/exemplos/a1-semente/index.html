<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0c10; }
      #root { width: 100%; height: 100%; position: relative; }
      .ponto { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #f4f4f5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      // mesmo sorteio, com semente fixa (mulberry32): mesma semente, mesmos pontos, em todo render
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const sorteio = mulberry32(42);
      const cena = document.getElementById("cena");
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "ponto";
        p.style.left = sorteio() * 1800 + "px";
        p.style.top = sorteio() * 1000 + "px";
        cena.appendChild(p);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".ponto", { scale: 0 }, { scale: 1, duration: 1, stagger: 0.1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
