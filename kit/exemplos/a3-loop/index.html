<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0c10; }
      #root { width: 100%; height: 100%; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; }
      #fundo { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #1c1c22 0%, #0c0c10 70%); }
      #trilho { position: absolute; left: 260px; top: 640px; width: 1400px; height: 4px; background: #3f3f47; transform-origin: left center; }
      #cabeca { position: absolute; left: 252px; top: 600px; width: 20px; height: 84px; background: #e9b949; border-radius: 4px; }
      #titulo { position: absolute; left: 0; right: 0; top: 380px; text-align: center; color: #f4f4f5; font-size: 140px; font-weight: 700; line-height: 1.1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="fundo"></div>
      <div id="trilho"></div>
      <div id="cabeca"></div>
      <h1 id="titulo">Cena 1</h1>
    </div>
    <script>
      // I: trilho e cabeça de leitura parados → a cabeça corre, o título entra e sai → a cabeça volta ao início.
      // De 5,4 s a 6 s o quadro é igual ao quadro 0: o loop não tem costura.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cabeca", { x: 0 }, { x: 1400, duration: 2.8, ease: "power1.inOut" }, 0.6);
      tl.fromTo("#titulo", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.0);
      tl.to("#titulo", { opacity: 0, duration: 0.5, ease: "power2.in" }, 3.6);
      tl.to("#cabeca", { x: 0, duration: 1.2, ease: "power2.inOut" }, 4.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
