<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0c10; }
      #root { width: 100%; height: 100%; position: relative; }
      .ponto { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #f4f4f5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      // 12 pontos em posições sorteadas: cada render sorteia de novo
      const cena = document.getElementById("cena");
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "ponto";
        p.style.left = Math.random() * 1800 + "px";
        p.style.top = Math.random() * 1000 + "px";
        cena.appendChild(p);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".ponto", { scale: 0 }, { scale: 1, duration: 1, stagger: 0.1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
